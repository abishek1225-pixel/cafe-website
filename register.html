
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee House - Register</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5eee6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .register-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 320px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4b2e2e;
            color: white;
            border: none;
            cursor: pointer;
        }

        .errorlist {
            color: red;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="register-box">
        <h2>Coffee House ☕</h2>
        <h3>Create Account</h3>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Register</button>
        </form>

        <p>Already have an account? <a href="/login/">Login</a></p>
    </div>
</body>
</html>
