
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee House Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5eee6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 300px;
        }

        input {
            width: 100%;
            padding: 10px 0;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4b2e2e;
            color: white;
            border: none;
            cursor: pointer;
        }

        .error {
            color: red;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Coffee House </h2>
        <h3>Login</h3>

        {% if form.errors %}
            <p class="error">Username or password is incorrect.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <input type="text" name="username"
                   placeholder="Username" required>

            <input type="password" name="password"
                   placeholder="Password" required>

            <button type="submit">Login</button>
        </form>
        <p>New user? <a href="/register/">Create an account</a></p>
    </div>
</body>
</html>
